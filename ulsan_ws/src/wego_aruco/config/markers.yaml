# ArUco DICT_4X4_50 마커 — 홈 위치 전용
# x, y: map frame 기준 마커 중심 좌표 (m)
# yaw:  마커 전면이 바라보는 방향 (rad) — 로봇을 향하는 방향
# size: 마커 한 변 길이 (m)
# 좌표는 Nav2 실주행 후 RViz에서 확인하여 입력
markers:
  0:                  # 로봇1 홈 마커
    x: 0.0
    y: 0.0
    yaw: 0.0
    size: 0.10
  1:                  # 로봇2 홈 마커
    x: 0.0
    y: 0.0
    yaw: 0.0
    size: 0.10

# home_key → marker_id 매핑
home_marker:
  home_robot1: 0
  home_robot2: 1
