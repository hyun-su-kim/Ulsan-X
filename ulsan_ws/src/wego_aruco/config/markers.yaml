# ArUco DICT_4X4_50 마커 설정
# size        : 마커 한 변 길이 (m)
# calibrated  : true이면 passive corrector가 map 좌표 사용. false이면 건너뜀.
# map_x/y/yaw : 마커 중심의 map 좌표 — 실기기 재측정 필요
markers:
  0:                  # 로봇1 홈 마커
    size: 0.20
    calibrated: false # 재측정 필요
    map_x: 0.0
    map_y: 0.0
    map_yaw: 0.0
  1:                  # 로봇2 홈 마커
    size: 0.20
    calibrated: false # 재측정 필요
    map_x: 0.0
    map_y: 0.0
    map_yaw: 0.0

# home_key → marker_id 매핑
home_marker:
  home_robot1: 0
  home_robot2: 1
