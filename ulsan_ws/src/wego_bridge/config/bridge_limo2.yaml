# LIMO 2 (domain 7) ↔ 관제 (domain 5) 양방향 브릿지
# 실행 위치: 관제 노트북 (ROS_DOMAIN_ID=5)
topics:
  /amcl_pose:
    type: geometry_msgs/msg/PoseWithCovarianceStamped
    from_domain: 7
    to_domain: 5
    remap: /limo2/amcl_pose
  /limo2/pause:
    type: std_msgs/msg/Empty
    from_domain: 5
    to_domain: 7
    remap: /pause
  /limo2/resume:
    type: std_msgs/msg/Empty
    from_domain: 5
    to_domain: 7
    remap: /resume
