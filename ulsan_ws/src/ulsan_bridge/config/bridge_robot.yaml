# 단일 브릿지 템플릿 — LIMO 1, 2 공통 사용
# bridge_launch.py가 ROS_DOMAIN_ID를 읽어 ROBOT_DOMAIN / ROBOT_NAME을 치환 후 실행
#
# 치환 대상:
#   ROBOT_DOMAIN → 6 (LIMO 1) or 7 (LIMO 2)   : 해당 LIMO의 ROS 도메인
#   ROBOT_NAME   → limo1 or limo2               : domain 5 토픽 prefix 및 remap 기준
#
# 브릿지 방향:
#   LIMO 도메인 → domain 5 : 로봇 위치·상태를 관제·트래픽 노드로 전달
#   domain 5 → LIMO 도메인 : 관제에서 로봇으로 제어 명령 전달

topics:
  # ── LIMO 도메인 → domain 5 ──────────────────────────────────────────
  /amcl_pose:
    type: geometry_msgs/msg/PoseWithCovarianceStamped
    from_domain: ROBOT_DOMAIN
    to_domain: 5
    remap: /ROBOT_NAME/amcl_pose      # ulsan_traffic, ulsan_ui가 구독

  /robot_status:
    type: std_msgs/msg/String
    from_domain: ROBOT_DOMAIN
    to_domain: 5
    remap: /ROBOT_NAME/robot_status   # ulsan_traffic, ulsan_dispatcher가 구독

  /diagnostics:
    type: diagnostic_msgs/msg/DiagnosticArray
    from_domain: ROBOT_DOMAIN
    to_domain: 5
    remap: /ROBOT_NAME/diagnostics    # ulsan_gui 시스템 상태 패널에서 로봇 연결 확인용

  /limo_status:
    type: limo_msgs/msg/LimoStatus
    from_domain: ROBOT_DOMAIN
    to_domain: 5
    remap: /ROBOT_NAME/limo_status    # ulsan_gui 배터리 표시용

  /person_detected:
    type: std_msgs/msg/Bool
    from_domain: ROBOT_DOMAIN
    to_domain: 5
    remap: /ROBOT_NAME/person_detected   # ulsan_gui 시스템 상태 '사람감지' liveness (10Hz 발행)

  # ── domain 5 → LIMO 도메인 ──────────────────────────────────────────
  /ROBOT_NAME/pause:
    type: std_msgs/msg/Empty
    from_domain: 5
    to_domain: ROBOT_DOMAIN
    remap: /pause                     # ulsan_traffic → ulsan_behaviour

  /ROBOT_NAME/resume:
    type: std_msgs/msg/Empty
    from_domain: 5
    to_domain: ROBOT_DOMAIN
    remap: /resume                    # ulsan_traffic → ulsan_behaviour

  /ROBOT_NAME/goal_destination:
    type: limo_msgs/msg/GuideGoal     # 목적지 + 출발 안내 멘트(tts)를 묶어 전달
    from_domain: 5
    to_domain: ROBOT_DOMAIN
    remap: /goal_destination          # ulsan_dispatcher → ulsan_behaviour

  /ROBOT_NAME/abort:
    type: std_msgs/msg/Empty
    from_domain: 5
    to_domain: ROBOT_DOMAIN
    remap: /abort                     # ulsan_gui → ulsan_behaviour

  /ROBOT_NAME/recover:
    type: std_msgs/msg/Empty
    from_domain: 5
    to_domain: ROBOT_DOMAIN
    remap: /recover                   # ulsan_gui [복구완료] → ulsan_behaviour FAILED 탈출

  # ※ /ROBOT_NAME/speak_text 라우트 폐지(2026-06-09): 출발 안내는 이제 GuideGoal.tts_text로
  #   behaviour를 거쳐 발화-완료대기-주행으로 동기화됨. 도착·실패 발화는 behaviour가 같은
  #   도메인에서 /speak_text로 직접 발행하므로 브릿지 불필요.

  /ROBOT_NAME/cmd_vel:
    type: geometry_msgs/msg/Twist
    from_domain: 5
    to_domain: ROBOT_DOMAIN
    remap: /cmd_vel                   # ulsan_gui 텔레옵 → LIMO

  # ── LIMO 도메인 → domain 5 (카메라) ─────────────────────────────────
  /camera/color/image_raw/compressed:
    type: sensor_msgs/msg/CompressedImage
    from_domain: ROBOT_DOMAIN
    to_domain: 5
    remap: /ROBOT_NAME/camera/image/compressed   # ulsan_gui 카메라 뷰
