# ArUco DICT_4X4_50 마커 설정
# size       : 마커 한 변 길이 (m)
# calibrated : true이면 passive corrector가 map pose 사용. false이면 건너뜀.
# map_x/y/z  : 마커 중심의 map 좌표 (m)
# map_qx/y/z/w : 마커 방향 quaternion (full 3D — 캘리브레이션 출력값 그대로 입력)
markers:
  0:                  # 로봇1 홈 마커
    size: 0.20
    calibrated: true
    map_x:  0.0155
    map_y:  0.2515
    map_z:  -0.0064
    map_qx: 0.0083
    map_qy: 0.7351
    map_qz: 0.6779
    map_qw: 0.0021
  1:                  # 로봇2 홈 마커
    size: 0.20
    calibrated: false # 미측정
    map_x:  0.0
    map_y:  0.0
    map_z:  0.0
    map_qx: 0.0
    map_qy: 0.0
    map_qz: 0.0
    map_qw: 1.0

# home_key → marker_id 매핑
home_marker:
  home_robot1: 0
  home_robot2: 1
