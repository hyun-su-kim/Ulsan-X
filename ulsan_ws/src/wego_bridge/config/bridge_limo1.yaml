# LIMO 1 (domain 6) ↔ 관제 (domain 5) 양방향 브릿지
# 실행 위치: 관제 노트북 (ROS_DOMAIN_ID=5)
topics:
  /amcl_pose:
    type: geometry_msgs/msg/PoseWithCovarianceStamped
    from_domain: 6
    to_domain: 5
    remap: /limo1/amcl_pose
  /robot_status:
    type: std_msgs/msg/String
    from_domain: 6
    to_domain: 5
    remap: /limo1/robot_status
  /limo1/pause:
    type: std_msgs/msg/Empty
    from_domain: 5
    to_domain: 6
    remap: /pause
  /limo1/resume:
    type: std_msgs/msg/Empty
    from_domain: 5
    to_domain: 6
    remap: /resume
  /limo1/goal_destination:
    type: std_msgs/msg/String
    from_domain: 5
    to_domain: 6
    remap: /goal_destination
  /limo1/speak_text:
    type: std_msgs/msg/String
    from_domain: 5
    to_domain: 6
    remap: /speak_text
