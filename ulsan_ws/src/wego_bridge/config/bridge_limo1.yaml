# LIMO 1 (domain 5) ↔ 관제 (domain 7) 양방향 브릿지
# 실행 위치: 관제 노트북 (ROS_DOMAIN_ID=7)
topics:
  /amcl_pose:
    type: geometry_msgs/msg/PoseWithCovarianceStamped
    from_domain: 5
    to_domain: 7
    remap: /limo1/amcl_pose
  /limo1/pause:
    type: std_msgs/msg/Empty
    from_domain: 7
    to_domain: 5
    remap: /pause
  /limo1/resume:
    type: std_msgs/msg/Empty
    from_domain: 7
    to_domain: 5
    remap: /resume
