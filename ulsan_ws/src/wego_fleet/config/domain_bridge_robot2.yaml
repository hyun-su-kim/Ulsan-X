# Domain Bridge 설정 — Robot 2 (LIMO 2, domain 7) 전용
#
# 실행 위치: 노트북 (domain 5)
# 실행 명령: ros2 launch wego_fleet laptop_bridge_launch.py
#
# 역할:
#   1. robot2의 /tf, /tf_static → domain 5 (노트북 RViz TF 트리)
#   2. robot2의 /amcl_pose      → domain 6 as /robot2/amcl_pose
#                                  (robot1의 fleet_obstacle_layer가 구독)
#
# 참고: /map은 robot1에서만 전송 (두 로봇이 동일한 맵 사용)
#
# 전제: robot2가 robot_name:=robot2 로 실행되어
#       TF 프레임이 robot2/odom, robot2/base_link 로 발행 중이어야 함.

name: robot2_bridge
from_domain: 7   # LIMO 2 domain
to_domain: 5     # 노트북 domain (기본값, 토픽별로 override 가능)

topics:

  # ── TF ───────────────────────────────────────────────────────────────────

  /tf:
    type: tf2_msgs/msg/TFMessage

  /tf_static:
    type: tf2_msgs/msg/TFMessage
    qos:
      reliability: reliable
      durability: transient_local
      depth: 1

  # ── Robot 간 pose 공유 (fleet obstacle layer용) ──────────────────────────

  /amcl_pose:
    type: geometry_msgs/msg/PoseWithCovarianceStamped
    to_domain: 6
    remap: /robot2/amcl_pose
