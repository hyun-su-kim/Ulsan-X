# Domain Bridge 설정 — Robot 1 (LIMO 1, domain 6) 전용
#
# 실행 위치: 노트북 (domain 5)
# 실행 명령: ros2 launch wego_fleet laptop_bridge_launch.py
#
# 역할:
#   1. robot1의 /tf, /tf_static → domain 5 (노트북 RViz TF 트리)
#   2. robot1의 /map            → domain 5 (노트북 RViz 지도, robot1만 전송)
#   3. robot1의 /amcl_pose      → domain 7 as /robot1/amcl_pose
#                                  (robot2의 fleet_obstacle_layer가 구독)
#
# 전제: robot1이 robot_name:=robot1 으로 실행되어
#       TF 프레임이 robot1/odom, robot1/base_link 로 발행 중이어야 함.

name: robot1_bridge
from_domain: 6   # LIMO 1 domain
to_domain: 5     # 노트북 domain (기본값, 토픽별로 override 가능)

topics:

  # ── TF ───────────────────────────────────────────────────────────────────

  /tf:
    type: tf2_msgs/msg/TFMessage

  /tf_static:
    type: tf2_msgs/msg/TFMessage
    qos:
      reliability: reliable
      durability: transient_local
      depth: 1

  # ── 노트북 RViz 지도 ─────────────────────────────────────────────────────

  # robot1만 전송 (두 로봇이 동일한 맵 사용 — 중복 전송 불필요).
  # transient_local: RViz 실행 후에도 맵을 즉시 수신할 수 있도록.
  /map:
    type: nav_msgs/msg/OccupancyGrid
    qos:
      reliability: reliable
      durability: transient_local
      depth: 1

  # ── Robot 간 pose 공유 (fleet obstacle layer용) ──────────────────────────

  /amcl_pose:
    type: geometry_msgs/msg/PoseWithCovarianceStamped
    to_domain: 7
    remap: /robot1/amcl_pose
