# ArUco DICT_4X4_50 마커 — 홈 위치 전용
# size: 마커 한 변 길이 (m)
# target_dist: 마커 정면에서 정차할 거리 (m) — 실기기 조정 필요
markers:
  0:                  # 로봇1 홈 마커
    size: 0.20
    target_dist: 2.007  # 실측 (2026-05-04, 최종 주차 위치 기준)
    # 참고: 0.699m = Phase1 중간 정렬 거리가 아닌, 예전 근접 주차 측정값
    cam_offset: 0.23
    map_x: 12.712  # home_robot1(12.498,-3.619,yaw=1.475) + total_dist(2.237)*cos(1.475)
    map_y: -1.393  # home_robot1(-3.619) + total_dist(2.237)*sin(1.475)
    map_yaw: -1.667  # home_robot1 yaw(1.475) - π
  1:                  # 로봇2 홈 마커
    size: 0.20
    target_dist: 0.30
    cam_offset: 0.23
    map_x: 0.0        # 미측정
    map_y: 0.0
    map_yaw: 0.0

# home_key → marker_id 매핑
home_marker:
  home_robot1: 0
  home_robot2: 1
